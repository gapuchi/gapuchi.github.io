theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: blue
  font:
    code: Fira Code
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.indexes

extra_javascript:
  - javascripts/config.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - def_list
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format 
  - pymdownx.arithmatex:
      generic: true

repo_url: https://github.com/gapuchi/gapuchi.github.io

site_name: Gapuchi's Notes
site_url: https://arjun.adhia.net/
site_description: Notes By Gapuchi
site_author: gapuchi

extra_css:
  - stylesheets/extra.css

nav:
  - Notes: index.md
  - Systems:
    - Linux:
      - notes/linux/index.md
      - Users, groups, and permissions: notes/linux/users-groups-permissions.md
